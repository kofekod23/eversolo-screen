<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Eversolo</title>
<link href="/static/fonts/fonts.css" rel="stylesheet">
<link href="/static/ecran.css" rel="stylesheet">
<link href="/static/themes/pochette.css" rel="stylesheet">
<link href="/static/themes/console.css" rel="stylesheet">
<link href="/static/themes/affiche.css" rel="stylesheet">
<link href="/static/themes/cadre.css" rel="stylesheet">
</head>
<body data-theme="pochette" data-profil="salon">
  <main class="stage arret" id="stage">
    <header class="faceplate">
      <a class="brand" href="/config"><b>Eversolo</b> <span id="model"></span></a>
      <div class="face-right">
        <div class="volmini" id="volmini" hidden>
          <span class="volbarre"><i id="volbarre"></i></span>
          <span id="voltexte"></span>
        </div>
        <span class="muet-badge" id="muetBadge"></span>
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <section class="now">
      <div class="cover-mount">
        <div class="placeholder" id="placeholder"></div>
        <img class="cover" id="cover" alt="">
        <div class="pause-glyph"><i></i></div>
      </div>
      <div class="meta" id="meta">
        <div class="eyebrow">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="status"></span>
          <span class="source" id="source"></span>
        </div>
        <h1 class="title" id="title"></h1>
        <div class="artist" id="artist"></div>
        <div class="album" id="album"></div>
        <div class="signal" id="signal"></div>
        <div class="decouverte" id="decouverte">
          <div class="fiche" id="fiche"><div class="dk" id="dk"></div><div class="dv" id="dv"></div></div>
        </div>
      </div>
    </section>

    <footer class="transport" id="transport">
      <div class="times">
        <span id="pos"></span>
        <span class="ensuite" id="ensuite"><b id="ensuiteK"></b> <span id="ensuiteV"></span></span>
        <span id="reste"></span>
      </div>
      <div class="filament"><div class="glow" id="glow"></div><div class="rail" id="rail"><div class="tip"></div></div></div>
    </footer>
  </main>

  <div id="osd"><div class="ok" id="osdK"></div><div class="val" id="osdV"></div><div class="jauge"><i id="osdJ"></i></div></div>

  <div id="dimmer"></div>
  <div id="panel">
    <div class="phead">
      <img id="p_img" alt="">
      <div>
        <div class="pname" id="p_name"></div>
        <div class="pfacts" id="p_facts"></div>
      </div>
    </div>
    <div class="pwrap" id="p_wrap">
      <div class="ptext" id="p_text">
        <div class="pbody" id="b_text"></div>
        <div class="psec" id="t_wrap" hidden>
          <div class="pseclabel" id="t_label"></div>
          <div class="ptracks" id="t_list"></div>
        </div>
        <div class="psec" id="c_wrap" hidden>
          <div class="pseclabel" id="c_label"></div>
          <div class="pcredits" id="c_list"></div>
        </div>
      </div>
      <div class="pfade" id="p_fade"></div>
      <div class="prail" id="p_rail"><div class="pthumb" id="p_thumb"></div></div>
    </div>
    <div class="phint" id="p_hint"></div>
    <div class="psrc" id="p_src"></div>
  </div>

  <div id="idle" class="on">
    <div class="grande-heure" id="grandeHeure"></div>
    <div class="date" id="date"></div>
    <div class="sub" id="idleMsg"></div>
    <div class="derniere" id="derniere"></div>
  </div>
  <div id="majBandeau" class="maj-bandeau" role="status"></div>
  <div id="veille"></div>

<script src="/static/ecran.js"></script>
</body>
</html>
